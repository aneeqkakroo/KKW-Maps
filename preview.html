<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kashmir boundaries (OSM-derived, disputed)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>body{margin:0;font-family:system-ui,sans-serif;color:#19334c;background:#f6f8fc}header{padding:18px 22px}h2{margin:0 0 7px}p{margin:6px 0;font-size:13px}#buttons{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 14px}button{background:white;border:1px solid #c9d3df;border-radius:8px;padding:8px 12px;cursor:pointer}button[aria-pressed="true"]{background:#173956;color:white}#map{height:66vh;border-top:1px solid #dfe5ee;border-bottom:1px solid #dfe5ee}.notice{font-size:12px;line-height:1.5;padding:14px 22px;max-width:900px}.leaflet-container{background:#ebf4fa}</style>
</head><body><header><h2>Jammu & Kashmir — six-region selector</h2><p>OSM-derived approximation of the former princely state. All claim lines are disputed or approximate.</p></header><div id="buttons"></div><div id="map"></div><p class="notice" id="status">Loading output GeoJSON… Run <code>python build_kashmir_geojson.py</code> first and serve this folder with <code>python -m http.server 8000</code>.</p>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const colors={ajk:'#db9a47',gb:'#4aaba4',jammu:'#a17cc4',kashmir:'#5b9fd1',ladakh:'#7888d7',aksai_chin:'#db9f87'};
const map=L.map('map',{scrollWheelZoom:false}).setView([34.5,76],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:13,attribution:'© OpenStreetMap contributors'}).addTo(map);
let active=null;let layer;let features=[];
function style(f){const id=f.properties.id;return {fillColor:colors[id]||'#bbb',color:active===id?'#132d47':'white',weight:active===id?3:1.4,fillOpacity:active===null||active===id?0.77:0.10};}
function setActive(id){active=(id===active)?null:id;layer.setStyle(style);document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.region===active)));document.getElementById('status').textContent=active?`Selected: ${features.find(f=>f.properties.id===active)?.properties.name||active}`:'Showing all six regions. Shaksgam is grouped with GB; the Siachen glacier is grouped with Ladakh.';}
fetch('./output/jammu_kashmir_six_regions.geojson').then(r=>{if(!r.ok)throw new Error('GeoJSON not generated yet');return r.json()}).then(data=>{features=data.features;layer=L.geoJSON(data,{style,onEachFeature:(f,l)=>{l.bindTooltip(f.properties.name);l.on('click',()=>setActive(f.properties.id));}}).addTo(map);map.fitBounds(layer.getBounds(),{padding:[25,25]});const parent=document.getElementById('buttons');const opts=[['','All regions'],...features.map(f=>[f.properties.id,f.properties.name])];opts.forEach(([id,name])=>{const b=document.createElement('button');b.dataset.region=id||'all';b.textContent=name;b.setAttribute('aria-pressed',String(!id));b.addEventListener('click',()=>setActive(id||null));parent.appendChild(b);});document.getElementById('status').textContent='Showing six selectable regions. Shaksgam is grouped with GB; the Siachen glacier is grouped with Ladakh.';return Promise.all(['jammu_kashmir_outer_outline.geojson','jammu_kashmir_special_overlays.geojson'].map(n=>fetch('./output/'+n).then(r=>r.json()).catch(()=>null)));}).then(([outline,overlays])=>{if(outline)L.geoJSON(outline,{interactive:false,style:{fill:false,color:'#202e40',weight:2.5}}).addTo(map);if(overlays)L.geoJSON(overlays,{interactive:false,style:{fill:false,color:'#ac3357',weight:1.2,dashArray:'5 6'}}).addTo(map)}).catch(e=>{document.getElementById('status').textContent='Could not load boundary output: '+e.message});
</script></body></html>
